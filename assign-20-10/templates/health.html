<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health Check</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #202124; }
        button { padding: 11px; background: #1769aa; color: white; border: 0; border-radius: 4px; cursor: pointer; }
        pre { background: #f1f3f4; padding: 16px; }
        a { margin-right: 14px; }
    </style>
</head>
<body>
    <nav><a href="/trigger">Trigger webhook</a><a href="/status">Transaction status</a></nav>
    <h1>Health Check</h1>
    <p>Check whether the transaction service is running.</p>
    <button id="check">Check health</button>
    <pre id="result">Click the button to check the service.</pre>
    <script>
        document.getElementById('check').addEventListener('click', async () => {
            const response = await fetch('/');
            document.getElementById('result').textContent = `HTTP ${response.status}\n${JSON.stringify(await response.json(), null, 2)}`;
        });
    </script>
</body>
</html>
