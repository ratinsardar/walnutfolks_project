<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction Webhook Tester</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #202124; }
        form { display: grid; gap: 12px; } label { font-weight: bold; }
        input { padding: 10px; border: 1px solid #bbb; border-radius: 4px; }
        button { padding: 11px; background: #1769aa; color: white; border: 0; border-radius: 4px; cursor: pointer; }
        pre { background: #f1f3f4; padding: 16px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Transaction Webhook Tester</h1>
    <p>Submit a transaction and check its current status. Processing takes 30 seconds.</p>
    <form id="transaction-form">
        <label>Transaction ID <input name="transaction_id" value="txn_web_001" required></label>
        <label>Source Account <input name="source_account" value="acc_user_001" required></label>
        <label>Destination Account <input name="destination_account" value="acc_merchant_001" required></label>
        <label>Amount <input name="amount" type="number" step="0.01" value="1500" required></label>
        <label>Currency <input name="currency" value="INR" maxlength="3" required></label>
        <button type="submit">Trigger Webhook</button>
    </form>
    <h2>Response</h2><pre id="result">Submit the form to see the response.</pre>
    <script>
        const form = document.getElementById('transaction-form'); const result = document.getElementById('result');
        form.addEventListener('submit', async (event) => { event.preventDefault(); const data = Object.fromEntries(new FormData(form)); data.amount = Number(data.amount); const response = await fetch('/v1/webhooks/transactions', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }); result.textContent = `HTTP ${response.status}\n${JSON.stringify(await response.json(), null, 2)}`; if (response.ok) setTimeout(() => checkStatus(data.transaction_id), 1000); });
        async function checkStatus(transactionId) { const response = await fetch(`/v1/transactions/${encodeURIComponent(transactionId)}`); result.textContent += `\n\nStatus check:\n${JSON.stringify(await response.json(), null, 2)}`; }
    </script>
</body>
</html>
